name: scan
on:
  schedule: [{cron: '30 12 * * *'}]     # 12:30 UTC = 18:00 IST (GitHub may delay runs)
  workflow_dispatch:
    inputs:
      lookback_days: {description: 'Lookback days', default: '3'}
concurrency: {group: scan, cancel-in-progress: false}
permissions: {contents: write}
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-mal tesseract-ocr-eng
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -r requirements.txt
      - name: Run scan
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          CHILD_DOB: ${{ secrets.CHILD_DOB }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python radar.py --lookback "${{ github.event.inputs.lookback_days || '3' }}"
      - name: Commit results
        if: always()
        run: |
          git config user.name audition-radar; git config user.email bot@users.noreply.github.com
          git add data docs && (git diff --cached --quiet || git commit -m "scan $(date -u +%F)") && git pull --rebase -X ours && git push
